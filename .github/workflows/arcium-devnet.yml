# Deploy aa_mxe to Arcium devnet (cluster 456) and run the whole suite there,
# against the real cluster.
#
# Runs only when the head commit's subject line starts with "[devnet]", from any
# branch, so a deployment can be tried without merging. "Starts with", not
# "contains": a commit that merely describes this workflow mentioned the tag in
# its body and set a deploy off. Needs two repository secrets:
#   ARCIUM_DEVNET_DEPLOY_KEY  Solana CLI keypair JSON (`npm run mxe:setup -- --deploy-key`)
#   HELIUS_API_KEY            the same key as Railway's SOLANA_RPC_URL
#
# The program id is derived from the deploy key (scripts/derive-program-keypair.js),
# so it is stable across deploys without a second secret. The committed
# declare_id is a localnet placeholder and is rewritten here, on the runner only.
#
# Results — program id, deploy mode, SOL spent, test outcome, latency — are
# emitted as annotations, the one part of a run the development session can read.

name: arcium-devnet

on:
  push:
    paths:
      - "mxe/**"
      - ".github/workflows/arcium-devnet.yml"

permissions:
  contents: read

concurrency:
  # One deployment at a time across branches, and never cancel one midway.
  group: arcium-devnet
  cancel-in-progress: false

jobs:
  deploy-test:
    if: startsWith(github.event.head_commit.message, '[devnet]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLUSTER_OFFSET: "456"
    defaults:
      run:
        working-directory: mxe
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: arcium-hq/setup-arcium@v0.15.0
        with:
          runner-arch-os: x86_64_linux
          arcium-version: "0.15.0"
          anchor-version: "1.0.2"
          solana-cli-version: "3.1.10"
          node-version: "24.10.0"

      - name: Secrets present
        env:
          DEPLOY_KEY: ${{ secrets.ARCIUM_DEVNET_DEPLOY_KEY }}
          HELIUS: ${{ secrets.HELIUS_API_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_KEY" ] || missing="$missing ARCIUM_DEVNET_DEPLOY_KEY"
          [ -n "$HELIUS" ] || missing="$missing HELIUS_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=devnet secrets missing::$missing"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Keys and program id
        env:
          DEPLOY_KEY: ${{ secrets.ARCIUM_DEVNET_DEPLOY_KEY }}
          HELIUS: ${{ secrets.HELIUS_API_KEY }}
        run: |
          mkdir -p ~/.config/solana target/deploy
          printf '%s' "$DEPLOY_KEY" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          program_id=$(node scripts/derive-program-keypair.js ~/.config/solana/id.json target/deploy/aa_mxe-keypair.json 2>/dev/null | tail -1)
          authority=$(solana-keygen pubkey ~/.config/solana/id.json)
          {
            echo "PROGRAM_ID=$program_id"
            echo "AUTHORITY=$authority"
            # The API key is a registered secret, so it is masked wherever this appears.
            echo "RPC_URL=https://devnet.helius-rpc.com/?api-key=$HELIUS"
          } >> "$GITHUB_ENV"
          echo "::notice title=devnet identities::program $program_id | upgrade authority $authority"

      # Rewrite the localnet placeholder on the runner only; nothing is committed.
      - name: Point the build at devnet
        run: |
          sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$PROGRAM_ID\")/" programs/aa_mxe/src/lib.rs
          python3 - <<'PY'
          import os, re
          pid, rpc = os.environ["PROGRAM_ID"], os.environ["RPC_URL"]
          a = open("Anchor.toml").read()
          a = re.sub(r'^aa_mxe = ".*"$', f'aa_mxe = "{pid}"', a, flags=re.M)
          a += f'\n[programs.devnet]\naa_mxe = "{pid}"\n'
          a = re.sub(r'(?ms)^\[provider\].*?(?=^\[|\Z)',
                     f'[provider]\ncluster = "{rpc}"\nwallet = "~/.config/solana/id.json"\n\n', a)
          open("Anchor.toml", "w").write(a)
          t = open("Arcium.toml").read()
          t += f'\n[clusters.devnet]\noffset = {os.environ["CLUSTER_OFFSET"]}\n'
          open("Arcium.toml", "w").write(t)
          PY
          grep -n "declare_id" programs/aa_mxe/src/lib.rs

      - name: Build
        run: |
          set -o pipefail
          arcium build 2>&1 | tee ci-build.log

      # Devnet SOL is free but rationed. What the deploy needs scales with the
      # binary (programdata + a same-size buffer while it uploads) and the
      # circuits the tests upload; check before spending a deploy on it.
      - name: Fund the deploy key
        run: |
          lamports() { awk -v b="$1" 'BEGIN { printf "%d", (b + 128) * 6960 }'; }
          so=$(stat -c %s target/deploy/aa_mxe.so)
          circuits=0; for f in build/*.arcis; do circuits=$((circuits + $(stat -c %s "$f"))); done
          need=$(( $(lamports $((so + 45))) * 2 + $(lamports $circuits) + 1000000000 ))
          sol() { awk -v l="$1" 'BEGIN { printf "%.3f", l / 1e9 }'; }
          need_sol=$(sol "$need")
          bal() { solana balance "$AUTHORITY" --lamports --url "$RPC_URL" | awk '{print $1}'; }
          have=$(bal)
          echo "BAL_BEFORE=$have" >> "$GITHUB_ENV"
          for i in 1 2 3; do
            [ "$have" -ge "$need" ] && break
            solana airdrop 2 "$AUTHORITY" --url https://api.devnet.solana.com || true
            sleep 15; have=$(bal)
          done
          have_sol=$(sol "$have")
          if [ "$have" -lt "$need" ]; then
            echo "::error title=devnet SOL short::have ${have_sol} SOL, need ≈ ${need_sol} SOL. Send devnet SOL to ${AUTHORITY} (https://faucet.solana.com)."
            exit 1
          fi
          echo "::notice title=devnet SOL::have ${have_sol} SOL, need ≈ ${need_sol} SOL (program ${so} B, circuits ${circuits} B)"

      - name: Deploy
        run: |
          set -o pipefail
          if solana program show "$PROGRAM_ID" --url "$RPC_URL" >/dev/null 2>&1; then
            mode=upgrade; extra="--skip-init"
          else
            mode=fresh; extra=""
          fi
          echo "DEPLOY_MODE=$mode" >> "$GITHUB_ENV"
          arcium deploy \
            --cluster-offset "$CLUSTER_OFFSET" \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --program-keypair target/deploy/aa_mxe-keypair.json \
            --rpc-url "$RPC_URL" \
            $extra 2>&1 | tee ci-deploy.log
          echo "::notice title=deploy::${mode} → ${PROGRAM_ID} on cluster ${CLUSTER_OFFSET}"

      - name: Test on devnet
        run: |
          set -o pipefail
          arcium test --cluster devnet 2>&1 | tee ci-test.log
          echo "::notice title=arcium test (devnet)::$(grep -E 'passing|failing|pending' ci-test.log | paste -sd ' ' -)"

      - name: Report latency and spend
        if: always()
        run: |
          if [ -s ci-test.log ]; then
            grep -E '\[(latency|compare)\]' ci-test.log | sed -e 's/^ *//' -e 's/ (finalize .*)$//' > latency.txt || true
            [ -s latency.txt ] && echo "::notice title=MPC latency (devnet)::$(sed -e 's/%/%25/g' latency.txt | awk 'BEGIN{ORS="%0A"} {print}')"
          fi
          if [ -n "${BAL_BEFORE:-}" ]; then
            after=$(solana balance "$AUTHORITY" --lamports --url "$RPC_URL" | awk '{print $1}')
            spent=$(awk -v b="$BAL_BEFORE" -v a="$after" 'BEGIN { printf "%.6f", (b - a) / 1e9 }')
            echo "::notice title=devnet SOL spent::${spent} SOL this run (deploy mode: ${DEPLOY_MODE:-none})"
          fi

      - name: Report failure
        if: failure()
        run: |
          for f in ci-test.log ci-deploy.log ci-build.log; do
            [ -s "$f" ] || continue
            tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
            echo "::error title=$f (last 80 lines)::$(cat tail.txt)"
          done
